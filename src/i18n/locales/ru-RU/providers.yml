providers:
  anthropic:
    name: Anthropic Официальный
    description: Официальный Anthropic API
    notes: Используются официальные модели Claude, а версия модели остается по выбору пользователя.
    networkAdvice: Лучше всего подходит для сред, которые могут напрямую обращаться к Anthropic.
  zai:
    name: Zhipu AI (ZAI)
    description: Claude-совместимая услуга API, предоставляемая Zhipu AI
    notes: Требуется ключ API, выданный платформой Zhipu AI.
    networkAdvice: Лучше всего подходит для пользователей, которым нужна точка входа, совместимая с Claude материкового Китая.
  aliyun:
    name: Aliyun DashScope
    description: Claude-совместимая услуга API, предоставляемая Aliyun DashScope
    notes: Использует унифицированное сопоставление модели glm-4.7 на всех уровнях.
    networkAdvice: Лучше всего подходит для развертываний в материковом Китае с более сильным локальным подключением к Aliyun.
  minimax:
    name: MiniMax
    description: Claude-совместимая услуга API, предоставляемая MiniMax
    notes: Использует унифицированную модель MiniMax-M2.5 на всех уровнях.
    networkAdvice: Лучше всего подходит для пользователей, предпочитающих шлюз, совместимый с MiniMax Claude.
  volcengine:
    name: Volcengine Coding Plan
    description: Claude-совместимая услуга API, предоставляемая Volcengine
    notes: Использует унифицированное сопоставление модели glm-4.7 на всех уровнях.
    networkAdvice: Лучше всего подходит для развертываний, предпочитающих точку входа в сеть Volcengine.
  custom:
    name: Пользовательская конечная точка API
    description: Предоставляемая пользователем конечная точка Claude / Anthropic-compatible API
    notes: Вы должны указать конечную точку URL и соответствующие учетные данные вручную.
    networkAdvice: Лучше всего подходит для автономных шлюзов или сторонних прокси-серверов Anthropic-compatible.
