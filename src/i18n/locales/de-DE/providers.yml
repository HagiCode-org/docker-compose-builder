providers:
  anthropic:
    name: Anthropic Offiziell
    description: Offiziell Anthropic API
    notes: Verwendet offizielle Claude-Modelle und die Modellversion bleibt vom Benutzer wählbar.
    networkAdvice: Am besten für Umgebungen geeignet, die Anthropic direkt erreichen können.
  zai:
    name: Zhipu AI (ZAI)
    description: Claude-kompatibler API-Dienst bereitgestellt von Zhipu AI
    notes: Erfordert einen API-Schlüssel, der von der Zhipu AI-Plattform ausgestellt wurde.
    networkAdvice: Am besten für Benutzer geeignet, die einen für Festlandchina geeigneten Claude-kompatiblen Einstiegspunkt wünschen.
  aliyun:
    name: Aliyun DashScope
    description: Claude-kompatibler API-Dienst bereitgestellt von Aliyun DashScope
    notes: Verwendet die einheitliche glm-4.7-Modellzuordnung über alle Ebenen hinweg.
    networkAdvice: Am besten geeignet für Bereitstellungen auf dem chinesischen Festland mit stärkerer lokaler Konnektivität zu Aliyun.
  minimax:
    name: MiniMax
    description: Claude-kompatibler API-Dienst bereitgestellt von MiniMax
    notes: Verwendet das einheitliche MiniMax-M2.5-Modell über alle Ebenen hinweg.
    networkAdvice: Am besten für Benutzer geeignet, die das MiniMax Claude-kompatible Gateway bevorzugen.
  volcengine:
    name: Volcengine Coding Plan
    description: Claude-kompatibler API-Dienst bereitgestellt von Volcengine
    notes: Verwendet die einheitliche glm-4.7-Modellzuordnung über alle Ebenen hinweg.
    networkAdvice: Am besten für Bereitstellungen geeignet, die einen Netzwerkeintrittspunkt Volcengine bevorzugen.
  custom:
    name: Benutzerdefinierter API-Endpunkt
    description: Vom Benutzer bereitgestellter Claude / Anthropic-compatible API Endpunkt
    notes: Sie müssen den Endpunkt URL und die entsprechenden Anmeldeinformationen manuell bereitstellen.
    networkAdvice: Am besten für selbst gehostete Gateways oder Anthropic-compatible-Proxys von Drittanbietern geeignet.
