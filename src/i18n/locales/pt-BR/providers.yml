providers:
  anthropic:
    name: Anthropic Oficial
    description: Oficial Anthropic API
    notes: Usa modelos Claude oficiais e a versão do modelo permanece selecionável pelo usuário.
    networkAdvice: Melhor para ambientes que podem atingir Anthropic diretamente.
  zai:
    name: Zhipu AI (ZAI)
    description: Serviço API compatível com Claude fornecido por Zhipu AI
    notes: Requer uma chave API emitida pela plataforma Zhipu AI.
    networkAdvice: Ideal para usuários que desejam um ponto de entrada compatível com Claude compatível com a China continental.
  aliyun:
    name: Aliyun DashScope
    description: Serviço API compatível com Claude fornecido por Aliyun DashScope
    notes: Usa o mapeamento de modelo glm-4.7 unificado em todas as camadas.
    networkAdvice: Melhor para implantações na China continental com conectividade local mais forte para Aliyun.
  minimax:
    name: MiniMax
    description: Serviço API compatível com Claude fornecido por MiniMax
    notes: Usa o modelo MiniMax-M2.5 unificado em todas as camadas.
    networkAdvice: Melhor para usuários que preferem o gateway compatível com MiniMax Claude.
  volcengine:
    name: Volcengine Coding Plan
    description: Serviço API compatível com Claude fornecido por Volcengine
    notes: Usa o mapeamento de modelo glm-4.7 unificado em todas as camadas.
    networkAdvice: Melhor para implantações que preferem um ponto de entrada de rede Volcengine.
  custom:
    name: Ponto final API personalizado
    description: Endpoint Claude / Anthropic-compatible API fornecido pelo usuário
    notes: Você deve fornecer o endpoint URL e as credenciais correspondentes manualmente.
    networkAdvice: Melhor para gateways auto-hospedados ou proxies Anthropic-compatible de terceiros.
