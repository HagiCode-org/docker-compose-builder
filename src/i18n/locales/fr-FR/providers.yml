providers:
  anthropic:
    name: Anthropic Officiel
    description: Officiel Anthropic API
    notes: Utilise les modèles Claude officiels et la version du modèle reste sélectionnable par l'utilisateur.
    networkAdvice: Idéal pour les environnements pouvant atteindre directement Anthropic.
  zai:
    name: Zhipu AI (ZAI)
    description: Service API compatible Claude fourni par Zhipu AI
    notes: Nécessite une clé API émise par la plateforme Zhipu AI.
    networkAdvice: Idéal pour les utilisateurs qui souhaitent un point d'entrée compatible Claude compatible avec la Chine continentale.
  aliyun:
    name: Aliyun DashScope
    description: Service API compatible Claude fourni par Aliyun DashScope
    notes: Utilise le mappage de modèle unifié glm-4.7 à tous les niveaux.
    networkAdvice: Idéal pour les déploiements en Chine continentale avec une connectivité locale plus forte vers Aliyun.
  minimax:
    name: MiniMax
    description: Service API compatible Claude fourni par MiniMax
    notes: Utilise le modèle unifié MiniMax-M2.5 à tous les niveaux.
    networkAdvice: Idéal pour les utilisateurs qui préfèrent la passerelle compatible MiniMax Claude.
  volcengine:
    name: Volcengine Coding Plan
    description: Service API compatible Claude fourni par Volcengine
    notes: Utilise le mappage de modèle unifié glm-4.7 à tous les niveaux.
    networkAdvice: Idéal pour les déploiements qui préfèrent un point d’entrée réseau Volcengine.
  custom:
    name: Point de terminaison API personnalisé
    description: Point de terminaison Claude / Anthropic-compatible API fourni par l'utilisateur
    notes: Vous devez fournir manuellement le point de terminaison URL et les informations d'identification correspondantes.
    networkAdvice: Idéal pour les passerelles auto-hébergées ou les proxys Anthropic-compatible tiers.
