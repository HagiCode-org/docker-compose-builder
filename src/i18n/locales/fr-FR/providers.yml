providers:
  anthropic:
    name: Anthropic Official
    description: Official Anthropic API
    notes: Uses official Claude models, and the model version stays user-selectable.
    networkAdvice: Best for environments that can reach Anthropic directly.
  zai:
    name: Zhipu AI (ZAI)
    description: Claude-compatible API service provided by Zhipu AI
    notes: Requires an API key issued by the Zhipu AI platform.
    networkAdvice: Best for users who want a Mainland China friendly Claude-compatible entry point.
  aliyun:
    name: Aliyun DashScope
    description: Claude-compatible API service provided by Aliyun DashScope
    notes: Uses the unified glm-4.7 model mapping across all tiers.
    networkAdvice: Best for Mainland China deployments with stronger local connectivity to Aliyun.
  minimax:
    name: MiniMax
    description: Claude-compatible API service provided by MiniMax
    notes: Uses the unified MiniMax-M2.5 model across all tiers.
    networkAdvice: Best for users who prefer the MiniMax Claude-compatible gateway.
  volcengine:
    name: Volcengine Coding Plan
    description: Claude-compatible API service provided by Volcengine
    notes: Uses the unified glm-4.7 model mapping across all tiers.
    networkAdvice: Best for deployments that prefer a Volcengine network entry point.
  custom:
    name: Custom API Endpoint
    description: User-provided Claude / Anthropic-compatible API endpoint
    notes: You must provide the endpoint URL and matching credentials manually.
    networkAdvice: Best for self-hosted gateways or third-party Anthropic-compatible proxies.
