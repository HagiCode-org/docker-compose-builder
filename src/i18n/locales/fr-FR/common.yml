  sections:
    profile:
      title: Mode de déploiement
      shortTitle: Mode
      description: Choisissez un démarrage rapide ou une personnalisation complète avant de modifier des options plus approfondies.
    base:
      title: Déploiement de base
      shortTitle: Socle
      description: Configurez les ports, la source de l'image et les détails d'exécution de base.
    executors:
      title: Capacités de l'exécuteur
      shortTitle: Exécuteurs testamentaires
      description: Activez les branches d'exécution et remplissez les informations d'identification dont chaque branche active a besoin.
    https:
      title: Accès HTTPS
      shortTitle: HTTPS
      description: Exposez le déploiement via Caddy uniquement lorsque HTTPS est activé.
    database:
      title: Stratégie de base de données
      shortTitle: Base de données
      description: Passez en revue le runtime SQLite fixe utilisé par les déploiements exportés.
    advanced:
      title: Configuration avancée
      shortTitle: Avancé
      description: Gérez les montages, les autorisations et autres paramètres de licence au niveau du déploiement de l'espace de travail.
  executorItemsTitle: Branches d'exécuteur activées
  executorItems:
    claude:
      title: Identifiants Claude
      description: Paramètres du fournisseur Anthropic-compatible, du point de terminaison, du jeton et du réglage Claude Code.
    codex:
      title: Exécution Codex
      description: CODEX_API_KEY et CODEX_BASE_URL en option.
    opencode:
      title: Exécution OpenCode
      description: Sélection de modèle géré et mode de persistance de configuration.
    codeServer:
      title: Valeurs par défaut du serveur de code
      description: Mode d'authentification de l'hôte du conteneur /port, et publication de l'hôte facultative pour code-server.
    eula:
      title: Conteneur EULA
      description: Opt-in ACCEPT_EULA partagé ainsi que le lien d'accord de documents.
