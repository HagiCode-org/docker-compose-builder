providers:
  anthropic:
    name: Anthropic 官方
    description: 官方 Anthropic API
    notes: 使用官方 Claude 模型，用户可自定义选择模型版本。
    networkAdvice: 适合可直接访问 Anthropic 官方服务的环境。
  zai:
    name: 智谱 AI (ZAI)
    description: 智谱 AI 提供的 Claude API 兼容服务
    notes: 需要从智谱 AI 平台获取 API Key。
    networkAdvice: 适合希望使用国内 Claude 兼容接入的用户。
  aliyun:
    name: 阿里云 DashScope
    description: 阿里云灵积平台提供的 Claude API 兼容服务
    notes: 使用统一的 glm-4.7 模型适用于所有层级。
    networkAdvice: 适合中国大陆用户，通常具备更稳定的本地网络连通性。
  minimax:
    name: MiniMax
    description: MiniMax 提供的 Claude API 兼容服务
    notes: 使用统一的 MiniMax-M2.5 模型适用于所有层级。
    networkAdvice: 适合希望接入 MiniMax Claude 兼容服务的用户。
  volcengine:
    name: 火山引擎 Coding Plan
    description: 火山引擎提供的 Claude API 兼容服务
    notes: 使用统一的 glm-4.7 模型适用于所有层级。
    networkAdvice: 适合优先使用火山引擎网络入口的部署环境。
  custom:
    name: 自定义 API 端点
    description: 用户提供的自定义 Claude / Anthropic 兼容 API 端点
    notes: 需要手动提供 API 端点 URL 与对应凭据。
    networkAdvice: 适合已有自托管网关或第三方 Anthropic 兼容代理的环境。
