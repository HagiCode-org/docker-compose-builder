  status:
    active: 当前
    complete: 已就绪
    error: 需修复
    pending: 待完善
  sections:
    profile:
      title: 部署模式
      shortTitle: 模式
      description: 先选择快速开始或完全自定义，再继续编辑更深入的配置。
    base:
      title: 基础部署
      shortTitle: 基础
      description: 集中配置端口、镜像源和基础运行参数。
    executors:
      title: 执行器能力
      shortTitle: 执行器
      description: 启用需要的执行器分支，并填写每个分支所需的认证信息。
    https:
      title: HTTPS 访问
      shortTitle: HTTPS
      description: 仅在启用 HTTPS 时展示 Caddy 代理与证书相关配置。
    database:
      title: 数据库策略
      shortTitle: 数据库
      description: 查看导出部署固定使用的 SQLite 运行时配置。
    advanced:
      title: 高级配置
      shortTitle: 高级
      description: 处理工作区挂载、权限与许可证等部署级设置。
  executorItemsTitle: 已启用的执行器分支
  executorItems:
    claude:
      title: Claude 凭据
      description: Anthropic 兼容 provider、端点、token 与 Claude Code 扩展选项。
    codex:
      title: Codex 运行时
      description: 配置 CODEX_API_KEY 与可选的 CODEX_BASE_URL。
    opencode:
      title: OpenCode 运行时
      description: 托管模型选择与配置持久化模式。
    codeServer:
      title: Code Server 默认值
      description: 配置 code-server 的容器 host/port、认证模式，以及可选的宿主机端口发布。
    eula:
      title: 容器 EULA
      description: 共享的 ACCEPT_EULA 同意开关，以及对应的 docs 协议入口。
