providers:
  anthropic:
    name: Anthropic Oficial
    description: Oficial Anthropic API
    notes: Utiliza modelos oficiales Claude y la versión del modelo sigue siendo seleccionable por el usuario.
    networkAdvice: Lo mejor para entornos que pueden llegar a Anthropic directamente.
  zai:
    name: Zhipu AI (ZAI)
    description: Servicio API compatible con Claude proporcionado por Zhipu AI
    notes: Requiere una clave API emitida por la plataforma Zhipu AI.
    networkAdvice: Lo mejor para los usuarios que desean un punto de entrada compatible con Claude compatible con China continental.
  aliyun:
    name: Aliyun DashScope
    description: Servicio API compatible con Claude proporcionado por Aliyun DashScope
    notes: Utiliza el mapeo del modelo glm-4.7 unificado en todos los niveles.
    networkAdvice: Lo mejor para implementaciones en China continental con una conectividad local más sólida a Aliyun.
  minimax:
    name: MiniMax
    description: Servicio API compatible con Claude proporcionado por MiniMax
    notes: Utiliza el modelo unificado MiniMax-M2.5 en todos los niveles.
    networkAdvice: Lo mejor para los usuarios que prefieren la puerta de enlace compatible con MiniMax Claude.
  volcengine:
    name: Volcengine Coding Plan
    description: Servicio API compatible con Claude proporcionado por Volcengine
    notes: Utiliza el mapeo del modelo glm-4.7 unificado en todos los niveles.
    networkAdvice: Lo mejor para implementaciones que prefieren un punto de entrada de red Volcengine.
  custom:
    name: Punto final API personalizado
    description: Punto final Claude / Anthropic-compatible API proporcionado por el usuario
    notes: Debe proporcionar el punto final URL y las credenciales coincidentes manualmente.
    networkAdvice: Lo mejor para puertas de enlace autohospedadas o servidores proxy Anthropic-compatible de terceros.
